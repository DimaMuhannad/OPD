<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1184 440" width="1184" height="440"><defs><marker id="ai" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#002C5F"/></marker><marker id="ab" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#005AAA"/></marker><marker id="ar" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#E70F47"/></marker><marker id="ag" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#009A49"/></marker><marker id="aw" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#FFFFFF"/></marker><marker id="ad" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#242834"/></marker></defs><ellipse cx="592" cy="95" rx="570" ry="92" fill="none" stroke="#009A49" stroke-width="2.5" stroke-dasharray="9 8" opacity=".55"/><text x="592" y="95.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#009A49" font-weight="700" font-style="normal" opacity="0.8">следствия: к чему это приводит?</text><text x="14" y="200.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#005AAA" font-weight="700" font-style="normal" opacity="1">ПРОБЛЕМА</text><rect x="292.0" y="193.0" width="600" height="84.0" rx="12" fill="#005AAA" stroke="#005AAA" stroke-width="2.5" opacity="1"/><text x="592" y="220.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#FFFFFF" font-weight="700" font-style="normal" opacity="1">Владельцы поливают неправильно, и это</text><text x="592" y="250.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#FFFFFF" font-weight="700" font-style="normal" opacity="1">заметно слишком поздно</text><text x="14" y="322.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#002C5F" font-weight="700" font-style="normal" opacity="1">ПРИЧИНЫ</text><rect x="42.0" y="343.0" width="340" height="84.0" rx="12" fill="#FFFFFF" stroke="#002C5F" stroke-width="3" opacity="1"/><text x="212" y="370.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#002C5F" font-weight="400" font-style="normal" opacity="1">Полив на глаз, а не по</text><text x="212" y="400.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#002C5F" font-weight="400" font-style="normal" opacity="1">почве</text><line x1="288.0" y1="346" x2="478.0" y2="277" stroke="#002C5F" stroke-width="3" marker-end="url(#ai)"/><rect x="422.0" y="343.0" width="340" height="84.0" rx="12" fill="#FFFFFF" stroke="#002C5F" stroke-width="3" opacity="1"/><text x="592" y="370.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#002C5F" font-weight="400" font-style="normal" opacity="1">Влажность на глубине</text><text x="592" y="400.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#002C5F" font-weight="400" font-style="normal" opacity="1">корней не видна</text><line x1="592.0" y1="346" x2="592.0" y2="277" stroke="#002C5F" stroke-width="3" marker-end="url(#ai)"/><rect x="802.0" y="346.0" width="340" height="78.0" rx="12" fill="#FFFFFF" stroke="#002C5F" stroke-width="3" opacity="1"/><text x="972" y="385.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#002C5F" font-weight="400" font-style="normal" opacity="1">При отъезде полива нет</text><line x1="896.0" y1="346" x2="