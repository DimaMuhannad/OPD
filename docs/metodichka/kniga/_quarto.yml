# Книга: методические указания по проектной деятельности. Готовы шаги 1.3 и 3.2 (пилот).
# Сборка: ./build.sh  ->  _out/ (веб, рукопись docx для РИЦ, PDF А5)
project:
  output-dir: _out
  render: [glavy/1-3-principy.qmd, glavy/3-2-wbs.qmd]

lang: ru
bibliography: istochniki.bib
csl: shablony/gost-r-7-0-100-2018-numeric.csl
link-citations: false
number-sections: true
number-depth: 3                # number-offset и имя PDF А5 — в шапке каждой главы
filters: [shablony/opd.lua]
crossref:
  fig-title: "Рис."
  tbl-title: "Таблица"
  fig-prefix: "рис."
  tbl-prefix: "таблица"
  title-delim: "."

format:
  html:
    css: shablony/stil.css
    toc: true
    embed-resources: true
    mainfont: Arial
  docx:
    reference-doc: shablony/reference.docx
    toc: false
  typst:
    citeproc: true             # описание строит pandoc по нашему CSL; у Typst свой движок, он ошибается на ГОСТе
    mainfont: Times New Roman
    fontsize: 10.5pt
    section-numbering: "1.1.1"
    template-partials: [shablony/page.typ]
    include-before-body:
      - file: shablony/a5.typ
