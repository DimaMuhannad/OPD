-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#002C5F" font-weight="400" font-style="normal" opacity="1">Влажность на глубине</text><text x="232" y="277.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#002C5F" font-weight="400" font-style="normal" opacity="1">корней видна</text><line x1="275.2" y1="212" x2="466.0" y2="90" stroke="#005AAA" stroke-width="3" marker-end="url(#ab)"/><rect x="422.0" y="212.0" width="340" height="100.0" rx="12" fill="#FFFFFF" stroke="#005AAA" stroke-width="4" opacity="1"/><text x="592" y="262.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#002C5F" font-weight="400" font-style="normal" opacity="1">Датчик доступен по цене</text><line x1="592.0" y1="212" x2="592.0" y2="90" stroke="#005AAA" stroke-width="3" marker-end="url(#ab)"/><rect x="782.0" y="212.0" width="340" height="100.0" rx="12" fill="#FFFFFF" stroke="#242834" stroke-width="2.5" stroke-dasharray="8 7" opacity="0.65"/><text x="952" y="247.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#002C5F" font-weight="400" font-style="normal" opacity="0.65">Полив идёт и без</text><text x="952" y="277.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#002C5F" font-weight="400" font-style="normal" opacity="0.65">хозяина</text><line x1="908.8" y1="212" x2="718.0" y2="90" stroke="#242834" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#ad)"/><text x="972" y="372.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#242834" font-weight="400" font-style="normal" opacity="1">записываем как отказ:</text><text x="972" y="398.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="