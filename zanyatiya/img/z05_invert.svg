nt-style="normal" opacity="1">Владелец поливает по состоянию почвы</text><line x1="542" y1="84" x2="640" y2="84" stroke="#005AAA" stroke-width="3.5" marker-end="url(#ab)"/><rect x="12.0" y="134.0" width="520" height="60.0" rx="12" fill="#FFFFFF" stroke="#002C5F" stroke-width="3" opacity="1"/><text x="272" y="164.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#002C5F" font-weight="400" font-style="normal" opacity="1">Влажность на глубине корней не видна</text><rect x="652.0" y="134.0" width="520" height="60.0" rx="12" fill="#005AAA" stroke="#005AAA" stroke-width="2.5" opacity="1"/><text x="912" y="164.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#FFFFFF" font-weight="700" font-style="normal" opacity="1">Влажность на глубине корней видна</text><line x1="542" y1="164" x2="640" y2="164" stroke="#005AAA" stroke-width="3.5" marker-end="url(#ab)"/><rect x="12.0" y="214.0" width="520" height="60.0" rx="12" fill="#FFFFFF" stroke="#002C5F" stroke-width="3" opacity="1"/><text x="272" y="244.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#002C5F" font-weight="400" font-style="normal" opacity="1">Готовые датчики дороги</text><rect x="652.0" y="214.0" width="520" height="60.0" rx="12" fill="#005AAA" stroke="#005AAA" stroke-width="2.5" opacity="1"/><text x="912" y="244.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#FFFFFF" font-weight="700" font-style="normal" opacity="1">Датчик доступен по цене</text><line x1="542" y1="244" x2="640" y2="244" stroke="#005AAA" stroke-width="3.5" marker-end="url(#ab)"/><rect x="12.0" y="294.0" width="520" height="60.0" rx="12" fill="#FFFFFF" stroke="#002C5F" stroke-width="3" opacity="1"/><text x="272" y="324.0" text-anchor="middle" dominant-baseline="central" font-family="Ari